appId: com.checkout.app
productName: Checkout POS
directories:
  output: release
files:
  - dist/**/*
  - frontend-dist/**/*
  - package.json
  - node_modules/electron-updater/**/*
  - node_modules/lucide-react/**/*
  - node_modules/axios/**/*
asarUnpack:
  - frontend-dist/**/*
win:
  target:
    - nsis
    - portable
  certificateFile: null
  certificatePassword: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Checkout POS


