apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pos-checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: pos-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://pos_user:pos_password@postgres:5432/pos_db"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-refresh-secret
        - name: PORT
          value: "3000"
        - name: API_PREFIX
          value: "/api/v1"
        - name: CORS_ORIGIN
          value: "http://localhost:5173"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pos-checkout
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: pos-checkout
type: Opaque
stringData:
  jwt-secret: change-me-in-production-use-strong-secret
  jwt-refresh-secret: change-me-in-production-use-strong-refresh-secret
